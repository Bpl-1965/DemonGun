<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>惡魔輪盤 · Devil Roulette</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<!-- ============ 大廳 ============ -->
<section class="lobby" id="lobby">
  <h1 class="lobby__title">♠ 惡魔輪盤</h1>
  <p class="lobby__sub">Web 版本</p>

  <div class="lobby__card">
    <label class="field">
      <span class="field__label">你的名字</span>
      <input id="nameInput" class="field__input" maxlength="16" placeholder="無名賭徒" autocomplete="off" />
    </label>

    <div class="lobby__row">
      <button id="btnSolo" class="btn btn--blue btn--wide">單人開局（對戰 AI）</button>
    </div>

    <div class="lobby__divider"><span>或多人連線</span></div>

    <div class="lobby__row">
      <label class="field field--inline" for="maxPlayersSelect">
        <span class="field__label">人數</span>
        <select id="maxPlayersSelect" class="field__input field__select">
          <option value="1">1 人（單人對 AI）</option>
          <option value="2">2 人</option>
          <option value="3">3 人</option>
          <option value="4">4 人</option>
        </select>
      </label>
      <button id="btnCreate" class="btn btn--ghost">建立房間</button>
    </div>

    <div class="lobby__row">
      <input id="codeInput" class="field__input field__input--code" maxlength="4" placeholder="房碼" autocomplete="off" />
      <button id="btnJoin" class="btn btn--ghost">加入房間</button>
    </div>

    <p class="lobby__players" id="lobbyPlayers" hidden></p>

    <p class="lobby__msg" id="lobbyMsg"></p>
  </div>

  <div class="lobby__card lobby__card--rules">
    <h2 class="card__title">規則</h2>
    <ul class="rules" id="rulesList">
      <li>每回合重新隨機裝彈，開局先公開「實彈 / 空包彈」數量 3 秒。</li>
      <li>對自己開槍打空包彈 → 保留回合，繼續行動。</li>
      <li>打出實彈，或對敵人開槍（不論實彈空包）→ 立刻交棒。</li>
      <li>每輪開始每人發 2 個道具（第 3 輪起 3 個），道具多數不消耗回合。</li>
      <li>Oppo play HOK so trash</li>
    </ul>
  </div>
</section>

<!-- ============ 遊戲畫面：上下對戰 ============ -->
<section class="game" id="game" hidden>

  <!-- 頂部細條：輪次 / 房碼 / 工具 -->
  <header class="bar">
    <!-- 回合倒數：只有輪到你時才出現 -->
    <div class="turn-timer" id="turnTimerWrap" hidden>
      <div class="turn-timer__ring" id="turnTimer">20</div>
    </div>
    <span class="bar__item">第 <b id="roundLabel">1</b> 輪</span>
    <span class="bar__sep">·</span>
    <span class="bar__item">房碼 <b id="codeLabel">—</b></span>
    <div class="bar__tools">
      <button class="btn btn--tiny btn--blue" id="startBtn" hidden>開局</button>
      <button class="btn btn--tiny" id="quitBtn">離開</button>
    </div>
  </header>

  <main class="arena">

    <!-- 上半：對手（1 個置中、3 個並排） -->
    <section class="row row--foes" aria-label="對手">
      <div class="foes" id="opponents"></div>
    </section>

    <!-- 中央：只放散彈槍與回合文字 -->
    <section class="row row--gun">
      <div class="turn" id="turnLabel">等待開局…</div>
      <div class="gun" id="gun" aria-hidden="true">🔫</div>
      <p class="bubble" id="bubble" hidden></p>
      <p class="hint" id="hint"></p>
    </section>

    <!-- 下半：我 + 專屬道具欄 -->
    <section class="row row--me">
      <div class="me" id="me">
        <div class="me__head">
          <span class="me__name" id="myName">—</span>
          <span class="me__status" id="myStatus">狀態正常</span>
        </div>
        <div class="hearts" id="myHearts" aria-label="你的生命值"></div>
        <p class="me__intel" id="myIntel" hidden></p>
      </div>
      <div class="items" id="itemsGrid"></div>
    </section>

  </main>

  <!-- 正下方：兩顆大按鈕 -->
  <footer class="actions">
    <div class="targets" id="targets" hidden></div>
    <div class="actions__row">
      <button class="btn btn--big btn--blue" id="btnSelf">
        <span class="btn__main">對自己開槍</span>
        <span class="btn__sub">空包彈可保留回合</span>
      </button>
      <button class="btn btn--big btn--red" id="btnEnemy">
        <span class="btn__main">對敵人開槍</span>
        <span class="btn__sub" id="enemySub">實彈才痛，但打完就交棒</span>
      </button>
    </div>
  </footer>
</section>

<!-- ============ 開局提示（3 秒後自動隱藏） ============ -->
<div class="reveal" id="reveal" hidden>
  <div class="reveal__card" id="revealCard">
    <div class="reveal__eyebrow">第 <b id="revealRound">1</b> 輪 · 本回合裝填</div>
    <div class="reveal__counts">
      <span class="reveal__live">實彈 <b id="revealLive">0</b> 發</span>
      <span class="reveal__slash">/</span>
      <span class="reveal__blank">空包彈 <b id="revealBlank">0</b> 發</span>
    </div>
    <div class="reveal__bar"><i id="revealBar"></i></div>
    <div class="reveal__foot">記住了嗎？Also oppo is gay</div>
  </div>
</div>

<!-- ============ 結算 ============ -->
<div class="result" id="result" hidden>
  <div class="result__card">
    <h2 class="result__title" id="resultTitle">—</h2>
    <p class="result__text" id="resultText"></p>
    <div class="result__actions">
      <button class="btn btn--blue" id="btnAgain">再來一局</button>
      <button class="btn btn--ghost" id="btnLeave">回大廳</button>
    </div>
  </div>
</div>

<datalist id="nameSuggest">
  <option value="Oppo is gay"></option>
  <option value="denn is gay"></option>
  <option value="Make by Bpl rename this"></option>
</datalist>

<!-- 道具說明提示框：跟著滑鼠跑，pointer-events:none 才不會擋點擊 -->
<div id="itemTooltip" class="item-tooltip" hidden></div>

<!-- Socket.IO 客戶端：優先本機檔案（離線可用），失敗才退 CDN -->
<script src="/vendor/socket.io.min.js" onerror="window.__sioLocalFailed = true"></script>
<script>
  if (!window.io) {
    document.write('<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"><\/script>');
  }
</script>
<script src="/client.js?v=20261118a"></script>
</body>
</html>
